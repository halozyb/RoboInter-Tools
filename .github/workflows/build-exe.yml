name: Build EXE

on:
  push:
    branches: [main, master, feature/build-exe]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy opencv-python PyQt5 flask portalocker tqdm pyyaml requests imageio imageio-ffmpeg matplotlib

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller RoboInter-Tools.spec --noconfirm --distpath dist --workpath build

      - name: Check output
        shell: cmd
        run: |
          dir dist\
          dir dist\RoboInter-Tools\

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoboInter-Tools-exe
          path: dist/RoboInter-Tools/
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RoboInter-Tools/RoboInter-Tools.exe
